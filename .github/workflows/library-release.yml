name: Prepare library release
on:
  workflow_dispatch:
  push:
    tags: ['session-activity-v*']

# Credentials are not needed to prepare the crate. Upload to crates.io is a
# separate explicit step from the reviewed, clean tagged checkout.
permissions:
  contents: read

jobs:
  crate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Validate library tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "session-activity"))')
          test "$GITHUB_REF_NAME" = "session-activity-v$version"
      - name: Verify standalone crate
        run: python3 scripts/package-library.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-activity-crate
          path: |
            dist/library/*.crate
            dist/library/SHA256SUMS
          if-no-files-found: error
