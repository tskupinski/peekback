name: Prepare release archive
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# This workflow only uploads reviewable workflow artifacts. Creating/publishing
# a GitHub release is a separate, explicit maintainer action.
permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "peekback"))')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Check
        run: bash scripts/check.sh
      - name: Verify Cargo installation and setup
        run: python3 tests/cargo_install.py
      - name: Build and verify archive
        run: |
          python3 scripts/package.py
          python3 tests/release_archive.py dist/peekback-*-aarch64-apple-darwin.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peekback-macos-arm64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
