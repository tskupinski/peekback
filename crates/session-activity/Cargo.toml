[package]
name = "session-activity"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
publish = ["crates-io"]
description = "File activity, evidence, and retained history for Claude Code and Codex sessions"
repository = "https://github.com/tskupinski/peekback"
homepage = "https://github.com/tskupinski/peekback/tree/main/crates/session-activity"
documentation = "https://docs.rs/session-activity"
readme = "README.md"
keywords = ["codex", "claude", "session", "file-tracking", "agent"]
categories = ["development-tools", "filesystem"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.45", features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
