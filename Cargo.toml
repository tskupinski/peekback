[package]
name = "peekback"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
global-hotkey = "0.8.0"
include_dir = "0.7.4"
libc = "0.2.189"
notify = "8.2.0"
plist = "1.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.37.0"
time = { version = "0.3.45", features = ["parsing", "macros"] }
toml = "1.1.6"
wry = "0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray"] }
