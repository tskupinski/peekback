[package]
name = "peekback"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Browse Claude Code and Codex session files in the terminal, with a native Markdown preview"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/tskupinski/peekback"
homepage = "https://github.com/tskupinski/peekback"
publish = ["crates-io"]
keywords = ["markdown", "codex", "claude", "preview", "terminal"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "assets/**", "hooks/**", "tests/*.rs", "licenses/**", "README.md", "SPEC.md", "RELEASING.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]

[workspace]
members = ["crates/session-activity"]
resolver = "3"

[profile.release]
strip = true
lto = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
global-hotkey = "0.8.0"
include_dir = "0.7.4"
libc = "0.2.189"
notify = "8.2.0"
plist = "1.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
session-activity = { version = "0.1.0", path = "crates/session-activity" }
tao = "0.37.0"
toml = "1.1.6"
unicode-width = "0.2.0"
wry = "0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray"] }
